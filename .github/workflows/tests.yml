name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
        gemfile: ["rails_7.2", "rails_8.0"]
        exclude:
          # Rails 8 requires Ruby >= 3.2 — this cell can never bundle.
          - ruby: "3.1"
            gemfile: "rails_8.0"
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test
      - name: Lint
        if: matrix.ruby == '3.4' && matrix.gemfile == 'rails_8.0'
        run: bundle exec rubocop
