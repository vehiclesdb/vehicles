plugins:
  - rubocop-minitest
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "vendor/**/*"
    - "gemfiles/**/*"
    - "lib/generators/**/templates/**/*"
    - "data/**/*"

# House style: double quotes everywhere, frozen string literals, compact classes.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always
Style/Documentation:
  Enabled: false

# Our curated data tables and lookup methods are intentionally long/dense.
Layout/LineLength:
  Max: 120
Metrics/MethodLength:
  Max: 30
Metrics/AbcSize:
  Max: 30
# The top-level Vehicles module/facade legitimately grows one short delegating
# method per capability (its `class << self` is the public API surface).
Metrics/ModuleLength:
  Max: 150
Metrics/ClassLength:
  Max: 150
  # The MCP server is one cohesive protocol class; half its lines are the
  # four tool JSON-Schema definitions (data, not logic).
  Exclude:
    - lib/vehicles/mcp_server.rb
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Naming/PredicatePrefix:
  ForbiddenPrefixes:
    - "is_"

# Keyword args are part of the provider contract even when a given provider
# doesn't use them (e.g. LocalProvider#image ignores year:/color:).
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true

# Thorough unit tests legitimately make several related assertions.
Minitest/MultipleAssertions:
  Enabled: false
